
            mutation Common_SetSavingsGoalBudgetAmount($input: SetSavingsGoalBudgetAmountInput!) {
              setSavingsGoalBudgetAmount(input: $input) {
                success
                errors {
                  ...PayloadErrorFields
                  __typename
                }
                __typename
              }
