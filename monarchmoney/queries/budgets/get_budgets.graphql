
          query GetJointPlanningData($startDate: Date!, $endDate: Date!, $useV2Goals: Boolean!) {
            budgetData(startMonth: $startDate, endMonth: $endDate) {
              monthlyAmountsByCategory {
                category {
                  id
                  __typename
                }
                monthlyAmounts {
                  month
                  plannedCashFlowAmount
                  plannedSetAsideAmount
                  actualAmount
                  remainingAmount
                  previousMonthRolloverAmount
                  rolloverType
                  __typename
                }
                __typename
              }
              monthlyAmountsByCategoryGroup {
                categoryGroup {
                  id
                  __typename
                }
                monthlyAmounts {
                  month
                  plannedCashFlowAmount
                  actualAmount
                  remainingAmount
                  previousMonthRolloverAmount
                  rolloverType
                  __typename
                }
                __typename
              }
              monthlyAmountsForFlexExpense {
                budgetVariability
                monthlyAmounts {
                  month
                  plannedCashFlowAmount
                  actualAmount
                  remainingAmount
                  previousMonthRolloverAmount
                  rolloverType
                  __typename
                }
                __typename
              }
              totalsByMonth {
                month
                totalIncome {
                  plannedAmount
                  actualAmount
                  remainingAmount
                  previousMonthRolloverAmount
                  __typename
                }
                totalExpenses {
                  plannedAmount
                  actualAmount
                  remainingAmount
                  previousMonthRolloverAmount
                  __typename
                }
                totalFixedExpenses {
                  plannedAmount
                  actualAmount
                  remainingAmount
                  previousMonthRolloverAmount
                  __typename
                }
                totalNonMonthlyExpenses {
                  plannedAmount
                  actualAmount
                  remainingAmount
                  previousMonthRolloverAmount
                  __typename
                }
                totalFlexibleExpenses {
                  plannedAmount
                  actualAmount
                  remainingAmount
                  previousMonthRolloverAmount
                  __typename
                }
                __typename
              }
              __typename
            }
            categoryGroups {
              id
              name
              order
              groupLevelBudgetingEnabled
              budgetVariability
              rolloverPeriod {
                id
                startMonth
                endMonth
                __typename
              }
              categories {
                id
                name
                order
                budgetVariability
                rolloverPeriod {
                  id
                  startMonth
                  endMonth
                  __typename
                }
                __typename
              }
              type
              __typename
            }
            goalsV2 @include(if: $useV2Goals) {
              id
              name
              archivedAt
              completedAt
              priority
              imageStorageProvider
              imageStorageProviderId
              plannedContributions(startMonth: $startDate, endMonth: $endDate) {
                id
                month
                amount
                __typename
              }
              monthlyContributionSummaries(startMonth: $startDate, endMonth: $endDate) {
                month
                sum
                __typename
              }
              __typename
            }
            budgetSystem
          }
