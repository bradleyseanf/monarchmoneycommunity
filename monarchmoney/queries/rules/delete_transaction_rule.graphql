
            mutation Common_DeleteTransactionRule($id: ID!) {
                deleteTransactionRule(id: $id) {
                    deleted
                    errors {
                        ...PayloadErrorFields
                        __typename
                    }
                    __typename
                }
            }

                fragment PayloadErrorFields on PayloadError {
                    fieldErrors {
                        field
                        messages
                        __typename
                    }
                    message
                    code
                    __typename
                }
