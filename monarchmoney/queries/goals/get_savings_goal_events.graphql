
            query Common_SavingsGoalEventsPaginated($id: ID!, $limit: Int, $offset: Int, $startDate: Date, $endDate: Date) {
              savingsGoal(id: $id) {
                id
                name
                imageStorageProvider
                imageStorageProviderId
                goalEventsPaginated(limit: $limit, offset: $offset, startDate: $startDate, endDate: $endDate) {
                  events {
                    ...GoalEventFields
                    __typename
                  }
                  totalEventCount
                  hasMoreEvents
                  nextOffset
                  __typename
                }
                __typename
              }
            }

            fragment GoalEventFields on GoalEvent {
              id
              date
              amount
              type
              createdAt
              canDelete
              includeInBudget
              notes
              account {
                icon
                displayName
                ...NewAccountLogoFields
                __typename
              }
              transaction {
                ...TransactionOverviewFields
                __typename
              }
              __typename
            }

            fragment NewAccountLogoFields on Account {
              id
              dataProvider
              logoUrl
              type {
                name
                display
                __typename
              }
              subtype {
                name
                __typename
              }
              institution {
                id
                primaryColor
                __typename
              }
              __typename
            }

            fragment TransactionOverviewFields on Transaction {
              id
              ownedByUser {
                id
                name
                __typename
              }
              ownershipOverriddenAt
              amount
              pending
              date
              hideFromReports
              plaidName
              notes
              isRecurring
              reviewStatus
              needsReview
              attachments {
                id
                extension
                filename
                originalAssetUrl
                publicId
                sizeBytes
                __typename
              }
              isSplitTransaction
              createdAt
              updatedAt
              category {
                id
                name
                __typename
              }
              merchant {
                name
                id
                transactionsCount
                __typename
              }
              account {
                id
                displayName
                __typename
              }
              businessEntity {
                id
                name
                __typename
              }
              tags {
                id
                name
                color
                order
                __typename
              }
              savingsGoalEvent {
                id
                goal {
                  id
                  name
                  __typename
                }
                __typename
              }
              __typename
            }
