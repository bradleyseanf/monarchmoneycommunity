
            query Common_GetSpinwheelCreditScoreSnapshots {
              me {
                id
                __typename
              }
              myHousehold {
                id
                users {
                  id
                  name
                  displayName
                  profilePictureUrl
                  __typename
                }
                __typename
              }
              spinwheelUser {
                id
                user {
                  id
                  name
                  displayName
                  __typename
                }
                onboardingStatus
                onboardingErrorMessage
                ...Common_SpinwheelUserFields
                __typename
              }
              creditScoreSnapshots {
                reportedDate
                score
                user {
                  id
                  __typename
                }
                __typename
              }
            }

            fragment Common_SpinwheelUserFields on SpinwheelUser {
              id
              spinwheelUserId
              creditScoreRefreshSubscriptionId
              creditScoreTrackingStatus
              isBillSyncTrackingEnabled
              __typename
            }
