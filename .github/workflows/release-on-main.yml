name: Create Release From Version

on:
  push:
    branches:
      - main
    paths:
      - monarchmoney/__init__.py

permissions:
  contents: write
  id-token: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/monarchmoneycommunity

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: current
        run: |
          version=$(python3 -c "import pathlib,re; text=pathlib.Path('monarchmoney/__init__.py').read_text(); match=re.search(r'__version__ = \"([^\"]+)\"', text); assert match, 'Could not find __version__ in monarchmoney/__init__.py'; print(match.group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check if release exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.current.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.current.outputs.version }}"
          gh release create "$tag" \
            --target "${{ github.sha }}" \
            --title "$tag" \
            --generate-notes

      - name: Set up Python
        if: steps.release.outputs.exists == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        if: steps.release.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        if: steps.release.outputs.exists == 'false'
        run: |
          python -m build

      - name: Publish package to PyPI
        if: steps.release.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
